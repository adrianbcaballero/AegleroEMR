name: Continuous Compliance

# Re-assess Aeglero against NIST 800-171 on a schedule (and on relevant changes),
# commit the refreshed evidence back to the repo so "continuous" is literally true
# in the git history, and fail the run if posture drifts down or SPRS drops below
# the gate.
on:
  schedule:
    - cron: "17 7 * * *"        # daily at 07:17 UTC
  workflow_dispatch:            # allow manual runs
  push:
    branches: [main]            # re-check when code/infra/CI change

permissions:
  contents: write               # needed to commit refreshed evidence

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assess:
    name: Assess, refresh evidence, gate on drift
    runs-on: ubuntu-latest
    steps:
      # Check out with the admin PAT (COMPLIANCE_BOT_TOKEN) so the evidence-refresh
      # push can bypass the branch-protection ruleset on main. The default
      # GITHUB_TOKEN is not an admin and would be blocked. Falls back to the default
      # token if the secret isn't set (push will then be skipped by the step below).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMPLIANCE_BOT_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The committed status.json (from the last run) is our drift baseline.
      - name: Snapshot previous status as baseline
        run: cp compliance/output/status.json /tmp/prev-status.json || true

      # Engine uses only the Python standard library - no pip install needed.
      - name: Run compliance engine
        run: python compliance/run.py

      # The evidence files are generated (gitignored), so we upload them as a
      # downloadable artifact instead of committing them. This avoids merge
      # conflicts between feature branches and the daily run.
      - name: Upload refreshed evidence
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: |
            compliance/output/
            compliance/dashboard/data.js
          if-no-files-found: error

      # Drift + SPRS gate. Fails the run (and thus alerts) if posture regressed
      # or the score fell below COMPLIANCE_MIN_SPRS. Evidence is already committed
      # above, so a regression is recorded even when this step fails.
      - name: Drift detection + SPRS gate
        env:
          COMPLIANCE_MIN_SPRS: "90"
        run: >
          python compliance/check_drift.py
          --old /tmp/prev-status.json
          --new compliance/output/status.json
